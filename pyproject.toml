[project]
name = "us-sector-monitor"
version = "0.1.0"
description = "Daily US stock sector market monitor based on sector ETFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "yfinance>=0.2.40",
]

[project.scripts]
us-sector-monitor = "us_sector_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]